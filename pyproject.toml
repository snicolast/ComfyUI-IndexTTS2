[project]
name = "indextts2"
description = "Lightweight ComfyUI wrapper for IndexTTS 2 (voice cloning + emotion control)."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["accelerate", "git+https://github.com/descriptinc/audiotools", "transformers", "tokenizers", "cn2an", "ffmpeg-python", "Cython", "g2p-en", "jieba", "json5", "keras", "munch", "numba", "numpy", "pandas", "matplotlib", "opencv-python", "tensorboard", "librosa", "safetensors", "modelscope", "omegaconf", "sentencepiece", "tqdm", "textstat", "pynini==2.1.6; platform_system!=\"Windows\"", "WeTextProcessing>=1.0.3; platform_system!=\"Windows\"", "WeTextProcessing; platform_machine != \"Darwin\"", "wetext; platform_system == \"Darwin\"", "wetext; platform_system == \"Windows\""]

[project.urls]
Repository = "https://github.com/snicolast/ComfyUI-IndexTTS2"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/snicolast/ComfyUI-IndexTTS2/wiki"
"Bug Tracker" = "https://github.com/snicolast/ComfyUI-IndexTTS2/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-IndexTTS2"
Icon = ""
includes = [] 
